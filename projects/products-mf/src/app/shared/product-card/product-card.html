<mat-card class="product-card">

  @if(product.isBestSeller){

    <span class="badge">
      Bestseller
    </span>

  }
  <button
  mat-icon-button
  class="wishlist-btn">

  <mat-icon>
    favorite_border
  </mat-icon>

</button>

  <img
    [src]="product.imageUrl"
    [alt]="product.name">

  <mat-card-content>

    <h3>{{ product.name }}</h3>

    <p>{{ product.description }}</p>

    <div class="rating">

      ⭐ {{ product.rating }}

      <span>
        ({{ product.reviewCount }} Reviews)
      </span>

    </div>

    <div class="price-row">

      <span class="price">

        ₹{{ product.price }}

      </span>

      <span class="old-price">

        ₹{{ product.originalPrice }}

      </span>

    </div>

    <div class="tags">

      <mat-chip>
        {{ product.weight }}
      </mat-chip>

      @if(product.isEggless){

        <mat-chip>
          Eggless
        </mat-chip>

      }

    </div>

  </mat-card-content>

  <mat-card-actions>

    <button
      mat-flat-button
      color="primary">

      Add To Cart

    </button>

  </mat-card-actions>

</mat-card>
