<mat-toolbar class="header-toolbar">

  <!-- Logo -->
  <div class="logo-section">

    <mat-icon class="logo-icon">
      cake
    </mat-icon>

    <span class="logo-text">
      CakeHub
    </span>

  </div>

  <!-- Search -->

  <div class="search-section">

    <mat-form-field
      appearance="outline"
      class="search-field">

      <mat-icon matPrefix>
        search
      </mat-icon>

      <input
        matInput
        placeholder="Search cakes, pastries, desserts...">

    </mat-form-field>

  </div>

  <!-- Right Menu -->

  <div class="action-section">

    <!-- Location -->

    <button
      mat-button
      class="location-btn">

      <mat-icon>
        location_on
      </mat-icon>

      <span>Mumbai</span>

    </button>

    <!-- Wishlist -->

    <button
      mat-icon-button
      matTooltip="Wishlist">

      <mat-icon>
        favorite_border
      </mat-icon>

    </button>

    <!-- Cart -->

    <button
      mat-icon-button
      [matBadge]="cartStore.cartCount()"
      matBadgeColor="warn"
      matTooltip="Cart">

      <mat-icon>
        shopping_cart
      </mat-icon>

    </button>

    <!-- Profile -->

    <button
      mat-button
      [matMenuTriggerFor]="profileMenu"
      class="profile-btn">

      <mat-icon>
        account_circle
      </mat-icon>

      <span>Priti</span>

      <mat-icon>
        keyboard_arrow_down
      </mat-icon>

    </button>

    <mat-menu #profileMenu="matMenu">

      <button mat-menu-item>
        <mat-icon>
          person
        </mat-icon>
        My Profile
      </button>

      <button mat-menu-item>
        <mat-icon>
          receipt_long
        </mat-icon>
        My Orders
      </button>

      <button mat-menu-item>
        <mat-icon>
          favorite
        </mat-icon>
        Wishlist
      </button>

      <button mat-menu-item>
        <mat-icon>
          logout
        </mat-icon>
        Logout
      </button>

    </mat-menu>

  </div>

</mat-toolbar>
